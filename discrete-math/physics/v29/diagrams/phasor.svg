<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="title desc"><title id="title">旋转矢量：投影给位移</title><desc id="desc">示意图，非按比例绘制</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#263d32"/></marker></defs><rect width="660" height="340" rx="16" fill="#f4f8f4"/><g font-family="sans-serif"><text x="28" y="35" font-size="21" fill="#263d32">旋转矢量：投影给位移</text><circle cx="210" cy="170" r="95" fill="none" stroke="#4e8064" stroke-width="2"/><path d="M90 170L340 170" stroke="#263d32" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M210 280L210 60" stroke="#263d32" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M210 170L265 92" stroke="#456eab" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M265 92L265 170" stroke="#b06d3d" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="277" y="94" font-size="17" fill="#263d32">A</text><text x="272" y="199" font-size="17" fill="#263d32">x = A cos θ</text><text x="353" y="138" font-size="17" fill="#263d32">θ 随时间增大</text><text x="353" y="174" font-size="17" fill="#263d32">先用位移定余弦</text><text x="353" y="210" font-size="17" fill="#263d32">再用速度定象限</text><text x="28" y="319" font-size="13" fill="#5d7264">示意图，非按比例绘制</text></g></svg>