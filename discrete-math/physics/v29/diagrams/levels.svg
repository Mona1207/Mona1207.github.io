<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="title desc"><title id="title">能级跃迁：光子能量等于能级差</title><desc id="desc">示意图，非按比例绘制</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#263d32"/></marker></defs><rect width="660" height="340" rx="16" fill="#f4f8f4"/><g font-family="sans-serif"><text x="28" y="35" font-size="21" fill="#263d32">能级跃迁：光子能量等于能级差</text><path d="M120 95L415 95" stroke="#456eab" stroke-width="3" fill="none"/><text x="65" y="101" font-size="17" fill="#263d32">n=3</text><path d="M120 145L415 145" stroke="#456eab" stroke-width="3" fill="none"/><text x="65" y="151" font-size="17" fill="#263d32">n=2</text><path d="M120 255L415 255" stroke="#456eab" stroke-width="3" fill="none"/><text x="65" y="261" font-size="17" fill="#263d32">n=1</text><path d="M265 103L265 245" stroke="#b06d3d" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="298" y="208" font-size="17" fill="#263d32">发射：高能级 → 低能级</text><text x="445" y="113" font-size="17" fill="#263d32">能量 E</text><text x="80" y="300" font-size="17" fill="#263d32">能级之间不能任意取值；电离终态能量取零</text><text x="28" y="319" font-size="13" fill="#5d7264">示意图，非按比例绘制</text></g></svg>