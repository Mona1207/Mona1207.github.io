<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="title desc"><title id="title">牛顿环：厚度随半径平方增加</title><desc id="desc">示意图，非按比例绘制</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#263d32"/></marker></defs><rect width="660" height="340" rx="16" fill="#f4f8f4"/><g font-family="sans-serif"><text x="28" y="35" font-size="21" fill="#263d32">牛顿环：厚度随半径平方增加</text><circle cx="210" cy="166" r="28" fill="none" stroke="#456eab" stroke-width="2"/><circle cx="210" cy="166" r="51" fill="none" stroke="#456eab" stroke-width="2"/><circle cx="210" cy="166" r="65" fill="none" stroke="#456eab" stroke-width="2"/><circle cx="210" cy="166" r="78" fill="none" stroke="#456eab" stroke-width="2"/><circle cx="210" cy="166" r="89" fill="none" stroke="#456eab" stroke-width="2"/><path d="M210 166L299 166" stroke="#b06d3d" stroke-width="3" fill="none"/><text x="245" y="157" font-size="17" fill="#263d32">r</text><text x="349" y="121" font-size="17" fill="#263d32">相同级次：r² 与波长成正比</text><text x="349" y="164" font-size="17" fill="#263d32">暗环：r² = mRλ / n</text><text x="349" y="210" font-size="17" fill="#263d32">充液后折射率增大，环收缩</text><text x="113" y="285" font-size="17" fill="#263d32">反射中心是否暗，取决于接触与相位条件</text><text x="28" y="319" font-size="13" fill="#5d7264">示意图，非按比例绘制</text></g></svg>