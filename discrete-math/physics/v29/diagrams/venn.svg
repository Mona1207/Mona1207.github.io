<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="title desc"><title id="title">集合运算：同一对象可以属于两个集合</title><desc id="desc">示意图，非按比例绘制</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#263d32"/></marker></defs><rect width="660" height="340" rx="16" fill="#f4f8f4"/><g font-family="sans-serif"><text x="28" y="35" font-size="21" fill="#263d32">集合运算：同一对象可以属于两个集合</text><rect x="65" y="65" width="500" height="205" rx="5" fill="#f4f8f4" stroke="#92a799"/><circle cx="255" cy="166" r="79" fill="#dce8f4" stroke="#456eab" stroke-width="2"/><circle cx="355" cy="166" r="79" fill="#e6edcf" stroke="#4e8064" stroke-width="2"/><text x="217" y="165" font-size="17" fill="#263d32">A</text><text x="379" y="165" font-size="17" fill="#263d32">B</text><text x="291" y="166" font-size="15" fill="#263d32">A∩B</text><text x="80" y="90" font-size="17" fill="#263d32">Ω</text><text x="97" y="299" font-size="17" fill="#263d32">并集表示至少一个；交集表示同时；补集相对于全集定义</text><text x="28" y="319" font-size="13" fill="#5d7264">示意图，非按比例绘制</text></g></svg>