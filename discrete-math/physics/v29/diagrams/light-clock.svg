<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="title desc"><title id="title">光钟：运动系中的光走更长路径</title><desc id="desc">示意图，非按比例绘制</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#263d32"/></marker></defs><rect width="660" height="340" rx="16" fill="#f4f8f4"/><g font-family="sans-serif"><text x="28" y="35" font-size="21" fill="#263d32">光钟：运动系中的光走更长路径</text><path d="M90 80L230 80" stroke="#263d32" stroke-width="3" fill="none"/><path d="M90 250L230 250" stroke="#263d32" stroke-width="3" fill="none"/><path d="M160 242L160 87" stroke="#456eab" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="77" y="282" font-size="17" fill="#263d32">钟静止：竖直往返</text><path d="M350 250L470 80" stroke="#456eab" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M470 80L590 250" stroke="#456eab" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M350 255L590 255" stroke="#b06d3d" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="355" y="282" font-size="17" fill="#263d32">钟运动：镜子同时平移</text><text x="362" y="53" font-size="17" fill="#263d32">两系中光速均为 c</text><text x="80" y="310" font-size="14" fill="#263d32">对同一只钟：固有时间较短，坐标时间 Δt = γ Δτ</text><text x="28" y="319" font-size="13" fill="#5d7264">示意图，非按比例绘制</text></g></svg>